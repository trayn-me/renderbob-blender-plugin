name: Build RenderBob Blender Add-on and Upload to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Package addon
        working-directory: scripts
        run: bash ./package-addon.sh

      - name: Upload to S3
        working-directory: dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: |
          aws s3 cp ./renderbob-addon.zip s3://$AWS_S3_BUCKET_NAME/addons/blender/renderbob-blender-plugin.zip --region $AWS_REGION
        shell: bash

